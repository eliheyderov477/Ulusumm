<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gözlərin 🤍</title>

<style>
body{
    margin:0;
    padding:0;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff7eb9,#ff2f92);
    font-family:Arial, sans-serif;
}

/* FOTO */
.container{
    position:relative;
}

.container img{
    height:85vh;
    max-width:95%;
    border-radius:25px;
    box-shadow:0 0 40px rgba(255,0,120,0.8);
}

/* ÜST MESAJ ŞERİT */
.message{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    background:rgba(255,0,120,0.85);
    color:white;
    text-align:center;
    padding:15px 10px;
    font-size:20px;
    border-top-left-radius:25px;
    border-top-right-radius:25px;
}

/* KALPLER ÖN PLAN */
.heart{
    position:fixed;
    top:-20px;
    font-size:30px;
    animation:fall linear forwards;
    z-index:999; /* HER ŞEYİN ÜSTÜNDE */
}

@keyframes fall{
    to{transform:translateY(120vh);}
}
</style>
</head>

<body>

<div class="container">
    <img src="gozler.jpg" alt="Gözlər">
    <div class="message">
        Dünyada gördüyüm ən gözəl gözlər səninkidi gözəlim 🤍
    </div>
</div>

<script>
const hearts=["🤍","❤️","💙"];

function createHeart(){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML=hearts[Math.floor(Math.random()*hearts.length)];
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(Math.random()*2+2)+"s";
    heart.style.fontSize=(Math.random()*30+25)+"px";
    document.body.appendChild(heart);

    setTimeout(()=>{heart.remove();},4000);
}

setInterval(createHeart,50);
</script>

</body>
</html>
