<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gözlerin 🤍</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9acb,#ff5fa2);
    font-family:Segoe UI, sans-serif;
}

/* ARKA PLAN KALPLER */
canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}

/* MESAJ */
.message{
    position:relative;
    z-index:2;
    margin-bottom:35px;
    padding:15px 25px;
    background:rgba(0,0,0,0.55);
    color:white;
    font-size:22px;
    font-weight:bold;
    border-radius:20px;
    text-align:center;
    max-width:85%;
}

/* FOTO */
.photo{
    position:relative;
    z-index:2;
}

.photo img{
    width:320px;
    max-width:85vw;
    border-radius:25px;
    display:block;
}
</style>
</head>

<body>

<canvas id="heartsCanvas"></canvas>

<div class="message">
Dünyada gördüyüm ən gözəl gözlər səninkidi gözəl gözlüm 🤍
</div>

<div class="photo">
    <img src="gozler.jpg" alt="Gözler">
</div>

<script>
const canvas = document.getElementById("heartsCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let hearts = [];

class Heart {
    constructor(){
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = 14 + Math.random() * 22;
        this.speed = 3 + Math.random() * 4; // HIZLI
        this.color = ["red","blue","white"][Math.floor(Math.random()*3)];
    }

    draw(){
        ctx.fillStyle = this.color;
        ctx.font = this.size + "px Arial";
        ctx.fillText("❤", this.x, this.y);
    }

    update(){
        this.y += this.speed;
        if(this.y > canvas.height){
            this.y = -20;
            this.x = Math.random() * canvas.width;
        }
    }
}

function init(){
    for(let i=0;i<250;i++){  // ÇOK YOĞUN
        hearts.push(new Heart());
    }
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    hearts.forEach(h=>{
        h.update();
        h.draw();
    });
    requestAnimationFrame(animate);
}

init();
animate();
</script>

</body>
</html>
