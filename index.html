<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gözlerin 🤍</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffb6c1, #ff69b4);
}

/* Arka Plan Kalpler */
.heart {
    position: absolute;
    font-size: 25px;
    animation: fall linear infinite;
    opacity: 0.9;
    z-index: 0;
}

@keyframes fall {
    0% { transform: translateY(-10vh); opacity: 1; }
    100% { transform: translateY(110vh); opacity: 0; }
}

/* Ana Container */
.container {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: zoom 6s ease-in-out infinite alternate;
}

@keyframes zoom {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
}

/* Foto (küçültüldü) */
.container img {
    width: 420px;
    max-width: 85vw;
    border-radius: 25px;
    box-shadow: 0 0 50px rgba(255,255,255,0.8);
}

/* Mesaj */
.message {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    color: white;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 15px #000;
}
</style>
</head>

<body>

<div class="container">
    <img src="gozler.jpg" alt="Gözler">
    <div class="message">
        Dünyada gördüyüm ən gözəl gözlər səninkidi gözəl gözlüm 🤍
    </div>
</div>

<script>
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");

    const colors = ["#ff0000", "#0000ff", "#ffffff"];
    heart.style.color = colors[Math.floor(Math.random() * colors.length)];
    heart.innerHTML = "❤";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    heart.style.fontSize = (18 + Math.random() * 25) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 120);
</script>

</body>
</html>
