<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anam 🤍</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffb6d9,#ff6fae);
    font-family:Segoe UI, sans-serif;
}

/* Kalpler arka plan */
canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}

/* Mesaj */
.message{
    position:relative;
    z-index:2;
    margin-bottom:40px;
    padding:18px 30px;
    background:rgba(0,0,0,0.55);
    color:white;
    font-size:26px;
    font-weight:bold;
    border-radius:25px;
    text-align:center;
    max-width:85%;
}

/* Foto */
.photo{
    position:relative;
    z-index:2;
}

.photo img{
    width:340px;
    max-width:90vw;
    border-radius:30px;
    display:block;
}
</style>
</head>

<body>

<canvas id="heartCanvas"></canvas>

<div class="message">
Dünyanın Ən Gözəl Anası Sənsən Anam 🤍
</div>

<div class="photo">
    <img src="annem.jpg" alt="Annem">
</div>

<script>
const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let hearts = [];

class Heart{
    constructor(){
        this.x = Math.random()*canvas.width;
        this.y = Math.random()*canvas.height;
        this.size = 16 + Math.random()*24;
        this.speed = 3 + Math.random()*4;
        this.color = ["red","blue","white"][Math.floor(Math.random()*3)];
    }

    draw(){
        ctx.fillStyle = this.color;
        ctx.font = this.size + "px Arial";
        ctx.fillText("❤", this.x, this.y);
    }

    update(){
        this.y += this.speed;
        if(this.y > canvas.height){
            this.y = -20;
            this.x = Math.random()*canvas.width;
        }
    }
}

function init(){
    for(let i=0;i<280;i++){ // ÇOK YOĞUN
        hearts.push(new Heart());
    }
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    hearts.forEach(h=>{
        h.update();
        h.draw();
    });
    requestAnimationFrame(animate);
}

init();
animate();
</script>

</body>
</html>
