<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gözlərin 🤍</title>

<style>
body{
    margin:0;
    padding:0;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;

    /* PEMBE KALPLİ ARKA PLAN */
    background-color:#ffb6d9;
    background-image:
      radial-gradient(circle at 20px 20px, rgba(255,255,255,0.6) 8px, transparent 9px),
      radial-gradient(circle at 60px 60px, rgba(255,0,100,0.5) 8px, transparent 9px);
    background-size:80px 80px;
}

/* FOTO */
.container{
    position:relative;
    z-index:2;
}

.container img{
    height:75vh;
    max-width:95%;
    border-radius:25px;
    box-shadow:0 0 40px rgba(255,0,150,0.8);
}

/* MESAJ FOTO ÜST KISMI */
.message{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%) scale(0);
    background:rgba(255,0,120,0.8);
    color:white;
    padding:15px 30px;
    border-radius:20px;
    font-size:20px;
    text-align:center;
    animation:pop 1s forwards;
    animation-delay:1s;
}

@keyframes pop{
    0%{transform:translateX(-50%) scale(0);}
    70%{transform:translateX(-50%) scale(1.1);}
    100%{transform:translateX(-50%) scale(1);}
}

/* KALPLER ÖN PLAN */
.heart{
    position:fixed;
    top:-20px;
    font-size:28px;
    animation:fall linear forwards;
    z-index:5; /* FOTO ÜSTÜNDE */
}

@keyframes fall{
    to{transform:translateY(120vh);}
}
</style>
</head>

<body>

<div class="container">
    <img src="gozler.jpg" alt="Gözlər">
    <div class="message">
        Dünyada gördüyüm ən gözəl gözlər səninkidi gözəlim 🤍
    </div>
</div>

<script>
const hearts=["🤍","❤️","💙"];

function createHeart(){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML=hearts[Math.floor(Math.random()*hearts.length)];
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(Math.random()*2+2)+"s";
    heart.style.fontSize=(Math.random()*25+25)+"px";
    document.body.appendChild(heart);

    setTimeout(()=>{heart.remove();},4000);
}

setInterval(createHeart,40); // ÇOK YOĞUN
</script>

</body>
</html>
