<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gözlerin 🤍</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffb6c1, #ff69b4);
}

/* Kalpler arka plan */
.hearts-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 0;
    pointer-events: none;
}

.heart {
    position: absolute;
    animation: fall linear forwards;
    opacity: 0.9;
}

@keyframes fall {
    from { transform: translateY(-10vh); }
    to { transform: translateY(110vh); }
}

/* Ana container */
.container {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: zoom 5s ease-in-out infinite alternate;
}

@keyframes zoom {
    from { transform: scale(1); }
    to { transform: scale(1.04); }
}

.card {
    position: relative;
    width: 380px;
    max-width: 90vw;
}

.card img {
    width: 100%;
    border-radius: 25px;
    display: block;
}

/* Mesaj şeridi */
.message-bar {
    position: absolute;
    top: 0;
    width: 100%;
    padding: 18px 10px;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
    color: white;
    font-size: 20px;
    font-weight: bold;
    border-top-left-radius: 25px;
    border-top-right-radius: 25px;
}
</style>
</head>

<body>

<div class="hearts-bg" id="hearts"></div>

<div class="container">
    <div class="card">
        <img src="gozler.jpg" alt="Gözler">
        <div class="message-bar">
            Dünyada gördüyüm ən gözəl gözlər səninkidi gözəl gözlüm 🤍
        </div>
    </div>
</div>

<script>
const heartsContainer = document.getElementById("hearts");

function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");

    const colors = ["#ff0000", "#0000ff", "#ffffff"];
    heart.style.color = colors[Math.floor(Math.random() * colors.length)];
    heart.innerHTML = "❤";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 30) + "px";

    // Daha hızlı düşüş
    heart.style.animationDuration = (1.5 + Math.random() * 1.5) + "s";

    heartsContainer.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 3000);
}

// Daha yoğun
setInterval(createHeart, 60);
</script>

</body>
</html>
