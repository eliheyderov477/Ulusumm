<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gözlerin 🤍</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffb6c1, #ff69b4);
}

/* Arka plan kalpler */
.hearts-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 0;
    pointer-events: none;
}

.heart {
    position: absolute;
    animation: fall linear forwards;
}

@keyframes fall {
    from { transform: translateY(-10vh); }
    to { transform: translateY(110vh); }
}

/* İçerik */
.container {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: zoom 5s ease-in-out infinite alternate;
}

@keyframes zoom {
    from { transform: scale(1); }
    to { transform: scale(1.03); }
}

.message {
    margin-bottom: 20px;
    padding: 15px;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
    color: white;
    font-size: 20px;
    font-weight: bold;
    border-radius: 15px;
}

.container img {
    width: 360px;
    max-width: 90vw;
    border-radius: 25px;
    display: block;
}
</style>
</head>

<body>

<div class="hearts-bg" id="hearts"></div>

<div class="container">
    <div class="message">
        Dünyada gördüyüm ən gözəl gözlər səninkidi gözəl gözlüm 🤍
    </div>
    <img src="gozler.jpg" alt="Gözler">
</div>

<script>
const heartsContainer = document.getElementById("hearts");

function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");

    const colors = ["#ff0000", "#0000ff", "#ffffff"];
    heart.style.color = colors[Math.floor(Math.random() * colors.length)];
    heart.innerHTML = "❤";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (18 + Math.random() * 35) + "px";

    // Daha hızlı
    heart.style.animationDuration = (1 + Math.random() * 1.2) + "s";

    heartsContainer.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 2500);
}

// ÇOK YOĞUN
setInterval(createHeart, 35);
</script>

</body>
</html>
