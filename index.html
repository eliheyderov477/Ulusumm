<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gözlerin 🤍</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffb6c1,#ff69b4);
font-family:Segoe UI;
position:relative;
}

/* Canvas arka plan */
canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

/* İçerik */
.content{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
gap:30px;
animation:zoom 4s ease-in-out infinite alternate;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.04);}
}

.message{
background:rgba(0,0,0,0.5);
color:white;
padding:15px 25px;
border-radius:20px;
font-size:22px;
font-weight:bold;
text-align:center;
max-width:80%;
}

img{
width:300px;
max-width:80vw;
border-radius:25px;
}
</style>
</head>

<body>

<canvas id="heartCanvas"></canvas>

<div class="content">
<div class="message">
Dünyada gördüyüm ən gözəl gözlər səninkidi gözəl gözlüm 🤍
</div>

<img src="gozler.jpg" alt="Gözler">
</div>

<script>
const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let hearts = [];

class Heart{
constructor(){
this.x = Math.random()*canvas.width;
this.y = Math.random()*canvas.height;
this.size = 10 + Math.random()*20;
this.speed = 2 + Math.random()*3;
this.color = ["red","blue","white"][Math.floor(Math.random()*3)];
}
draw(){
ctx.fillStyle=this.color;
ctx.font=this.size+"px Arial";
ctx.fillText("❤",this.x,this.y);
}
update(){
this.y += this.speed;
if(this.y > canvas.height){
this.y = -20;
this.x = Math.random()*canvas.width;
}
}
}

function init(){
for(let i=0;i<150;i++){  // ÇOK YOĞUN
hearts.push(new Heart());
}
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
hearts.forEach(h=>{
h.update();
h.draw();
});
requestAnimationFrame(animate);
}

init();
animate();
</script>

</body>
</html>
